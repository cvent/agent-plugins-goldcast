name: PR Secret Scan

# Scans pull requests opened against this repository for accidentally
# committed secrets. Published content reaches this repository by a direct
# push to main, not a pull request, so this check never covers published
# content — by design, not by gap.
#
# What it's actually for: this is a public repository, so anyone can fork it
# and open a PR regardless of CONTRIBUTING.md's guidance that PRs aren't the
# contribution path here. That's not hypothetical — anthropics/claude-plugins-official
# runs equivalent external-PR triage automation for the same reason. This repo
# has no CODEOWNERS file and no required-reviewer gate (see "Advisory only"
# below), so this workflow — plus close-external-prs.yml, which auto-closes
# any PR from a non-collaborator on open — are the only automated checks a PR
# here gets; this one runs with minimal permissions (contents: read, no
# elevated secrets), the standard safe pattern for scanning untrusted fork
# PRs, as defense-in-depth for the narrow window before a non-collaborator
# PR is closed, and for the rare collaborator-authored PR that isn't.
#
# Advisory only: this repository does not currently support required status
# checks. If that changes, enable "Require status checks to pass" on the
# main branch and add "Secret Scan" to the required list.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      # Runs the gitleaks CLI directly, pinned by version and SHA-256 so the
      # binary can't change underneath this workflow.
      - name: Run Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --verbose --no-banner \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"
